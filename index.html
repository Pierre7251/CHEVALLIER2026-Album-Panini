<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f1ea;
    color: #333;
}

/* =========================
   CONTENEUR PRINCIPAL
========================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* =========================
   TITRES
========================= */

h1 {
    text-align: center;
    margin: 10px 0 5px;
    color: #333;
    font-size: 32px;
}

h2 {
    text-align: center;
    margin: 5px 0 25px;
    color: #555;
    font-size: 22px;
}

.subtitle {
    text-align: center;
    margin-bottom: 25px;
    color: #777;
}

/* =========================
   NAVIGATION
========================= */

.navigation {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
}

.tab {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    background: #ddd;
    color: #333;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.tab:hover {
    background: #c8c8c8;
    transform: translateY(-1px);
}

.tab.active {
    background: #333;
    color: white;
}

/* =========================
   BOUTON RETOUR
========================= */

.back-button {
    display: block;
    margin: 0 auto 25px;
    border: none;
    background: #555;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.back-button:hover {
    background: #333;
}

/* =========================
   PAGE D'ACCUEIL
========================= */

.home-families {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    max-width: 900px;
    margin: 30px auto;
}

.home-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    cursor: pointer;
    transition: 0.25s;
    text-align: center;
}

.home-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 22px rgba(0,0,0,0.18);
}

.home-card h2 {
    margin-top: 10px;
    margin-bottom: 15px;
}

.home-card img {
    width: 100%;
    height: 350px;
    object-fit: contain;
    border-radius: 10px;
    background: #f5f5f5;
}

/* =========================
   LISTE DES FAMILLES
========================= */

.family-selection {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    max-width: 1000px;
    margin: 0 auto;
}

.family-button {
    background: white;
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.family-button:hover {
    border-color: #555;
    background: #fafafa;
    transform: translateY(-2px);
}

/* =========================
   PHOTOS
========================= */

.photos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
    margin-top: 25px;
}

.photo-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    text-align: center;
}

.photo-card img {
    width: 100%;
    height: 320px;
    object-fit: contain;
    display: block;
    border-radius: 8px;
    background: #f5f5f5;
}

.photo-name {
    margin-top: 12px;
    font-weight: bold;
    font-size: 17px;
}

/* =========================
   MESSAGE PHOTO ABSENTE
========================= */

.image-error {
    height: 320px;
    background: #eee;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: #888;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .container {
        padding: 12px;
    }

    h1 {
        font-size: 26px;
    }

    h2 {
        font-size: 19px;
    }

    .home-families {
        grid-template-columns: 1fr;
    }

    .home-card img {
        height: 300px;
    }

    .photos {
        grid-template-columns: 1fr;
    }

    .photo-card img {
        height: 350px;
    }

    .tab {
        width: 100%;
    }

    .navigation {
        flex-direction: column;
    }
}

/* ============================================================

const app = document.getElementById("app");


/* ============================================================
   PAGE D'ACCUEIL
   ============================================================ */

function showHome() {

    app.innerHTML = `

        <h1>Album Panini familial</h1>

        <div class="subtitle">
            Toute la famille
        </div>

        <div class="home-families">

            <div class="home-card"
                 onclick="showFamilyList('familleDeniseRaymond')">

                <img
                    src="${PHOTO_FOLDER}${album.home.left.image}"
                    alt="Denise et Raymond"
                    onerror="imageError(this)"
                >

                <h2>Denise et Raymond</h2>

            </div>


            <div class="home-card"
                 onclick="showFamilyList('famillePaulettePaul')">

                <img
                    src="${PHOTO_FOLDER}${album.home.right.image}"
                    alt="Paulette et Paul"
                    onerror="imageError(this)"
                >

                <h2>Paulette et Paul</h2>

            </div>

        </div>
    `;
}


/* ============================================================
   LISTE DES FAMILLES
   ============================================================ */

function showFamilyList(branchId) {

    const branch = album[branchId];

    let html = `

        <button class="back-button" onclick="showHome()">
            ← Retour
        </button>

        <h1>${branch.title}</h1>

        <div class="subtitle">
            Choisissez une famille
        </div>

        <div class="family-selection">
    `;

    branch.families.forEach(family => {

        html += `
            <button
                class="family-button"
                onclick="showFamily('${branchId}', '${family.id}')">

                ${family.name}

            </button>
        `;

    });

    html += `</div>`;

    app.innerHTML = html;
}


/* ============================================================
   AFFICHAGE D'UNE FAMILLE
   ============================================================ */

function showFamily(branchId, familyId) {

    const branch = album[branchId];

    const family = branch.families.find(
        item => item.id === familyId
    );

    if (!family) {
        showHome();
        return;
    }


    let html = `

        <button
            class="back-button"
            onclick="showFamilyList('${branchId}')">

            ← Retour aux familles

        </button>

        <h1>${family.name}</h1>

        <div class="navigation">
    `;


    /* ONGLET DES PERSONNES */

    family.people.forEach((person, index) => {

        html += `

            <button
                class="tab ${index === 0 ? "active" : ""}"
                onclick="showPerson(
                    '${branchId}',
                    '${familyId}',
                    ${index}
                )">

                ${person.name}

            </button>

        `;

    });


    html += `</div>`;


    html += `

        <div id="personContent"></div>

    `;


    app.innerHTML = html;


    showPerson(branchId, familyId, 0);
}


/* ============================================================
   AFFICHAGE D'UNE PERSONNE
   ============================================================ */

function showPerson(branchId, familyId, personIndex) {

    const branch = album[branchId];

    const family = branch.families.find(
        item => item.id === familyId
    );

    const person = family.people[personIndex];

    const content = document.getElementById("personContent");

    if (!content) return;


    let html = `

        <div class="photos">
    `;


    person.photos.forEach((photo, index) => {

        html += `

            <div class="photo-card">

                <img
                    src="${PHOTO_FOLDER}${photo[1]}"
                    alt="${photo[0]}"
                    onerror="imageError(this)"
                >

                <div class="photo-name">
                    ${index + 1}. ${photo[0]}
                </div>

            </div>

        `;

    });


    html += `</div>`;

    content.innerHTML = html;


    /* Gestion de l'onglet actif */

    document.querySelectorAll(".tab").forEach(
        button => button.classList.remove("active")
    );

    const buttons = document.querySelectorAll(".tab");

    if (buttons[personIndex]) {
        buttons[personIndex].classList.add("active");
    }
}


/* ============================================================
   GESTION DES PHOTOS INTROUVABLES
   ============================================================ */

function imageError(image) {

    const fileName = image.getAttribute("src");

    const div = document.createElement("div");

    div.className = "image-error";

    div.innerHTML = `
        <div>
            <strong>Photo à ajouter</strong><br><br>
            ${fileName}
        </div>
    `;

    image.replaceWith(div);
}
